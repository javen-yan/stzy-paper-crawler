name: Source Package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Version name, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  package-source:
    name: Package source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create source archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          PACKAGE="stzy-paper-crawler-${VERSION}-source"
          mkdir -p "release-packages/${PACKAGE}"

          rsync -a \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".venv/" \
            --exclude ".pytest_cache/" \
            --exclude ".DS_Store" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude ".stzy-credentials.key" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            --exclude "artifacts/" \
            --exclude "build/" \
            --exclude "dist/" \
            --exclude "output/" \
            --exclude "release-packages/" \
            --exclude "stzy.db" \
            --exclude "stzy.db-shm" \
            --exclude "stzy.db-wal" \
            --exclude "stzy_app/frontend/node_modules/" \
            --exclude "stzy_app/frontend/dist/" \
            ./ "release-packages/${PACKAGE}/"

          mkdir -p artifacts
          tar -czf "artifacts/${PACKAGE}.tar.gz" -C release-packages "${PACKAGE}"
          (cd release-packages && zip -qr "../artifacts/${PACKAGE}.zip" "${PACKAGE}")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stzy-paper-crawler-${{ steps.version.outputs.value }}-source
          path: artifacts/*
          if-no-files-found: error

      - name: Upload source package to GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.value }}" artifacts/* --repo "${{ github.repository }}" --clobber
