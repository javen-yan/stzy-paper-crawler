name: Build and Upload

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Version name, for example v0.1.0
        required: true
        default: v0.1.0
      upload_to_oss:
        description: Upload packages to Aliyun OSS
        required: true
        type: boolean
        default: true
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_name: windows-x64
            archive_ext: zip
            executable_name: stzy-paper-crawler.exe
            pyinstaller_sep: ";"
          - os: macos-15-intel
            package_name: macos-x64
            archive_ext: zip
            executable_name: stzy-paper-crawler
            pyinstaller_sep: ":"
          - os: macos-14
            package_name: macos-arm64
            archive_ext: zip
            executable_name: stzy-paper-crawler
            pyinstaller_sep: ":"
          - os: ubuntu-latest
            package_name: linux-x64
            archive_ext: tar.gz
            executable_name: stzy-paper-crawler
            pyinstaller_sep: ":"

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
        shell: pwsh

      - name: Build executable
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --onedir
          --name stzy-paper-crawler
          --collect-all nicegui
          --collect-all fastapi
          --collect-all starlette
          --collect-all uvicorn
          --collect-all pymupdf
          --hidden-import stzy_app.ui.page
          stzy_app/main.py

      - name: Prepare package directory
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          PACKAGE="stzy-paper-crawler-${VERSION}-${{ matrix.package_name }}"
          mkdir -p "packages/${PACKAGE}"
          cp -R "dist/stzy-paper-crawler" "packages/${PACKAGE}/app"
          chmod +x "packages/${PACKAGE}/app/${{ matrix.executable_name }}" || true
          cp README.md "packages/${PACKAGE}/"
          cp 操作手册.md "packages/${PACKAGE}/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            {
              printf '%s\n' '#!/usr/bin/env bash'
              printf '%s\n' 'set -euo pipefail'
              printf '%s\n' 'cd "$(dirname "$0")"'
              printf '%s\n' 'if [ ! -f ./app/stzy-paper-crawler ]; then'
              printf '%s\n' '  echo "启动失败：缺少 app/stzy-paper-crawler，请保持解压后的目录结构完整。"'
              printf '%s\n' '  read -r -p "按回车退出..." || true'
              printf '%s\n' '  exit 1'
              printf '%s\n' 'fi'
              printf '%s\n' 'chmod +x ./app/stzy-paper-crawler'
              printf '%s\n' 'export PYTHONUNBUFFERED=1'
              printf '%s\n' 'clear 2>/dev/null || true'
              printf '%s\n' 'echo "========================================"'
              printf '%s\n' 'echo " STZY Paper Crawler"'
              printf '%s\n' 'echo "========================================"'
              printf '%s\n' 'echo ""'
              printf '%s\n' 'echo "[1/4] 正在检查本地运行环境..."'
              printf '%s\n' 'echo "[2/4] 正在启动本地 Web 控制台..."'
              printf '%s\n' 'echo "      首次启动需要初始化页面资源，通常等待几秒到几十秒。"'
              printf '%s\n' 'echo "[3/4] 程序会自动选择可用端口；如果 8080 被占用，会自动换到 8081、8082..."'
              printf '%s\n' 'echo "[4/4] 请稍等，下面会显示实际访问地址。"'
              printf '%s\n' 'echo ""'
              printf '%s\n' 'echo "提示：浏览器未自动打开时，请复制终端里的 http://127.0.0.1:xxxx 地址到浏览器。"'
              printf '%s\n' 'echo "提示：请保持这个终端窗口打开；关闭窗口会停止本地服务。"'
              printf '%s\n' 'echo ""'
              printf '%s\n' 'echo "---------- 应用内部日志开始 ----------"'
              printf '%s\n' 'echo ""'
              printf '%s\n' 'exec ./app/stzy-paper-crawler'
            } > "packages/${PACKAGE}/start-macos.command"
            chmod +x "packages/${PACKAGE}/start-macos.command"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            {
              printf '%s\n' '#!/usr/bin/env bash'
              printf '%s\n' 'set -euo pipefail'
              printf '%s\n' 'cd "$(dirname "$0")"'
              printf '%s\n' 'if [ ! -f ./app/stzy-paper-crawler ]; then'
              printf '%s\n' '  echo "启动失败：缺少 app/stzy-paper-crawler，请保持解压后的目录结构完整。"'
              printf '%s\n' '  read -r -p "按回车退出..." || true'
              printf '%s\n' '  exit 1'
              printf '%s\n' 'fi'
              printf '%s\n' 'chmod +x ./app/stzy-paper-crawler'
              printf '%s\n' 'export PYTHONUNBUFFERED=1'
              printf '%s\n' 'clear 2>/dev/null || true'
              printf '%s\n' 'echo "========================================"'
              printf '%s\n' 'echo " STZY Paper Crawler"'
              printf '%s\n' 'echo "========================================"'
              printf '%s\n' 'echo ""'
              printf '%s\n' 'echo "[1/4] 正在检查本地运行环境..."'
              printf '%s\n' 'echo "[2/4] 正在启动本地 Web 控制台..."'
              printf '%s\n' 'echo "      首次启动需要初始化页面资源，通常等待几秒到几十秒。"'
              printf '%s\n' 'echo "[3/4] 程序会自动选择可用端口；如果 8080 被占用，会自动换到 8081、8082..."'
              printf '%s\n' 'echo "[4/4] 请稍等，下面会显示实际访问地址。"'
              printf '%s\n' 'echo ""'
              printf '%s\n' 'echo "提示：浏览器未自动打开时，请复制终端里的 http://127.0.0.1:xxxx 地址到浏览器。"'
              printf '%s\n' 'echo "提示：请保持这个终端窗口打开；关闭窗口会停止本地服务。"'
              printf '%s\n' 'echo ""'
              printf '%s\n' 'echo "---------- 应用内部日志开始 ----------"'
              printf '%s\n' 'echo ""'
              printf '%s\n' 'exec ./app/stzy-paper-crawler'
            } > "packages/${PACKAGE}/start-linux.sh"
            chmod +x "packages/${PACKAGE}/start-linux.sh"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            {
              printf '%s\r\n' '@echo off'
              printf '%s\r\n' 'chcp 65001 >nul'
              printf '%s\r\n' 'setlocal'
              printf '%s\r\n' 'cd /d "%~dp0"'
              printf '%s\r\n' 'set PYTHONUNBUFFERED=1'
              printf '%s\r\n' 'cls'
              printf '%s\r\n' 'echo ========================================'
              printf '%s\r\n' 'echo  STZY Paper Crawler'
              printf '%s\r\n' 'echo ========================================'
              printf '%s\r\n' 'echo.'
              printf '%s\r\n' 'echo [1/4] 正在检查本地运行环境...'
              printf '%s\r\n' 'if not exist "app\stzy-paper-crawler.exe" ('
              printf '%s\r\n' '  echo 启动失败：缺少 app\stzy-paper-crawler.exe，请保持解压后的目录结构完整。'
              printf '%s\r\n' '  pause'
              printf '%s\r\n' '  exit /b 1'
              printf '%s\r\n' ')'
              printf '%s\r\n' 'echo [2/4] 正在启动本地 Web 控制台...'
              printf '%s\r\n' 'echo       首次启动需要初始化页面资源，通常等待几秒到几十秒。'
              printf '%s\r\n' 'echo [3/4] 程序会自动选择可用端口；如果 8080 被占用，会自动换到 8081、8082...'
              printf '%s\r\n' 'echo [4/4] 请稍等，下面会显示实际访问地址。'
              printf '%s\r\n' 'echo.'
              printf '%s\r\n' 'echo 提示：浏览器未自动打开时，请复制终端里的 http://127.0.0.1:xxxx 地址到浏览器。'
              printf '%s\r\n' 'echo 提示：请保持这个终端窗口打开；关闭窗口会停止本地服务。'
              printf '%s\r\n' 'echo.'
              printf '%s\r\n' 'echo ---------- 应用内部日志开始 ----------'
              printf '%s\r\n' 'echo.'
              printf '%s\r\n' '"app\stzy-paper-crawler.exe"'
              printf '%s\r\n' 'pause'
            } > "packages/${PACKAGE}/start-windows.bat"
          fi
          {
            printf '%s\n' '推荐使用启动脚本启动：'
            printf '%s\n' '- macOS：双击 start-macos.command'
            printf '%s\n' '- Windows：双击 start-windows.bat'
            printf '%s\n' '- Linux：运行 ./start-linux.sh'
            printf '%s\n' ''
            printf '%s\n' '启动流程：'
            printf '%s\n' '1. 启动脚本会检查运行环境。'
            printf '%s\n' '2. 程序会启动本地 Web 控制台，首次启动通常需要几秒到几十秒；再次启动会更快。'
            printf '%s\n' '3. 默认从 8080 端口开始，如果端口被占用，会自动尝试 8081、8082，最多到 8099。'
            printf '%s\n' '4. 终端会显示实际访问地址，例如 http://127.0.0.1:8080。'
            printf '%s\n' ''
            printf '%s\n' '如果浏览器没有自动打开，请复制终端窗口中的 http://127.0.0.1:xxxx 地址到浏览器。'
            printf '%s\n' '请保持终端窗口打开；关闭终端窗口会停止本地 Web 控制台。'
            printf '%s\n' ''
            printf '%s\n' '请不要删除 app 目录；启动脚本会从 app 目录加载程序和依赖。'
            printf '%s\n' ''
            printf '%s\n' 'PDF 转图片能力已内置在程序依赖中，无需额外安装 Poppler。'
          } > "packages/${PACKAGE}/启动说明.txt"

      - name: Archive package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.value }}"
          $Package = "stzy-paper-crawler-$Version-${{ matrix.package_name }}"
          New-Item -ItemType Directory -Force -Path release-packages | Out-Null
          Compress-Archive -Path "packages/$Package" -DestinationPath "release-packages/$Package.zip" -Force

      - name: Archive package on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          PACKAGE="stzy-paper-crawler-${VERSION}-${{ matrix.package_name }}"
          mkdir -p release-packages
          ditto -c -k --sequesterRsrc --keepParent "packages/${PACKAGE}" "release-packages/${PACKAGE}.zip"

      - name: Archive package on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          PACKAGE="stzy-paper-crawler-${VERSION}-${{ matrix.package_name }}"
          mkdir -p release-packages
          tar -czf "release-packages/${PACKAGE}.tar.gz" -C packages "${PACKAGE}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stzy-paper-crawler-${{ steps.version.outputs.value }}-${{ matrix.package_name }}
          path: release-packages/*
          if-no-files-found: error

  upload-oss:
    name: Upload to Aliyun OSS
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_oss == true) }}

    env:
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: stzy-paper-crawler-${{ steps.version.outputs.value }}-*
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OSS uploader dependency
        run: python -m pip install oss2

      - name: Upload packages to GitHub Release
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.value }}" downloaded-artifacts/* --repo "${{ github.repository }}" --clobber

      - name: Upload packages to OSS
        env:
          UPLOAD_DIR: downloaded-artifacts
          OSS_PREFIX: stzy-paper-crawler/${{ steps.version.outputs.value }}
        run: python scripts/upload_to_oss.py
