name: Build Desktop (macOS & Windows)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "desktop-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.artifact_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            pdfium_target: mac-arm64
            artifact_name: macos-arm64
            run_tests: true
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            pdfium_target: mac-x64
            artifact_name: macos-x64
            run_tests: false
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            pdfium_target: win-x64
            artifact_name: windows-x64
            run_tests: true

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.artifact_name }}

      - name: Fetch prebuilt Pdfium library (${{ matrix.pdfium_target }})
        shell: bash
        run: bash desktop/scripts/fetch_pdfium.sh ${{ matrix.pdfium_target }}

      - name: Install Tauri CLI
        working-directory: desktop
        run: |
          npm install --include=dev --no-package-lock
          npx tauri --version

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Verify frontend TypeScript & Vite build
        working-directory: desktop/frontend
        run: npm run build

      - name: Run Rust unit tests
        if: matrix.run_tests
        working-directory: desktop/src-tauri
        run: cargo test --lib --target ${{ matrix.rust_target }}

      - name: Build Tauri Desktop Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          STZY_SKIP_FRONTEND_BUILD: "1"
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      - name: Upload macOS Installer Artifacts (.dmg)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: stzy-desktop-${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows Installer Artifacts (.exe & .msi)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stzy-desktop-${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi

  publish-release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Collect and verify all platform installers
        run: |
          mkdir -p release-dist
          find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec cp -v {} release-dist/ \;
          ls -lh release-dist
          test -n "$(find release-dist -maxdepth 1 -name '*_aarch64.dmg')"
          test -n "$(find release-dist -maxdepth 1 -name '*_x64.dmg')"
          test -n "$(find release-dist -maxdepth 1 -name '*-setup.exe')"
          test -n "$(find release-dist -maxdepth 1 -name '*.msi')"

      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: STZY Paper Crawler ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## STZY Paper Crawler ${{ github.ref_name }} · 原生桌面客户端 (`Rust + Tauri v2`)

            完全重写的跨平台原生桌面版本，无需安装 Python 或启动外部本地服务端。

            ### 安装包选择指南
            - **macOS（Apple Silicon M1/M2/M3/M4）**：下载 `*_aarch64.dmg`
            - **macOS（Intel 芯片）**：下载 `*_x64.dmg`
            - **Windows 10 / 11（64 位）**：下载 `*_x64-setup.exe`（推荐）或 `*_x64_en-US.msi`

            ### macOS 首次打开提示「“STZY Paper Crawler”已损坏，无法打开」解决方法
            由于安装包采用开源社区构建（未附加付费 Apple Developer ID 公证），浏览器下载后会携带 macOS 隔离属性（`com.apple.quarantine`）：
            1. 打开 `.dmg` 后，**先将 `STZY Paper Crawler.app` 拖入 `Applications`（应用程序）文件夹**（不要直接在磁盘映像窗口内双击运行）。
            2. 打开「终端（Terminal）」，执行以下命令移除隔离标记即可正常打开：
               ```bash
               xattr -cr "/Applications/STZY Paper Crawler.app"
               ```
          files: |
            release-dist/*.dmg
            release-dist/*.exe
            release-dist/*.msi
