[project]
name = "stzy-paper-crawler"
version = "0.1.6"
description = "Local web tool for crawling STZY paper preview images."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pillow>=10.0.0",
  "pymupdf>=1.24.0",
  "pycryptodome>=3.20.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "PySocks>=1.7.1",
]

[project.scripts]
stzy-crawler = "stzy_app.main:main"

[tool.setuptools.package-data]
stzy_app = ["frontend/dist/**/*"]

[tool.ruff]
line-length = 100
